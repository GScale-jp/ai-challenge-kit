<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デモ動画</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111e2d;
      color: #f4f8fc;
      font-family: system-ui, "Yu Gothic", "Hiragino Sans", sans-serif;
    }
    iframe, video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    iframe { background: #fff; }
    video { background: #111e2d; object-fit: contain; }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 8vw;
      background: #111e2d;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
    h1, p { margin: 0; }
    h1 { font-size: 5.5vw; line-height: 1.25; }
    p { margin-top: 2.4vw; font-size: 2.8vw; line-height: 1.55; white-space: pre-line; }
    p:empty { display: none; }
    #overlay.compact {
      inset: auto 3vw 3vw;
      display: block;
      padding: 1.25vw 2vw;
      border-radius: 0.8vw;
      background: #111e2dea;
    }
    .compact h1 { font-size: 2vw; }
    .compact p { margin-top: 0.35vw; font-size: 1.75vw; }
  </style>
</head>
<body>
  <iframe id="app" title="アプリの画面" hidden></iframe>
  <video id="clip" muted playsinline hidden></video>
  <div id="overlay">
    <h1 id="title"></h1>
    <p id="caption"></p>
  </div>
  <script>
    const app = document.querySelector('#app');
    const clip = document.querySelector('#clip');
    const overlay = document.querySelector('#overlay');
    const heading = document.querySelector('#title');
    const subtitle = document.querySelector('#caption');

    window.showScene = ({ title, caption, mode }) => {
      heading.textContent = title;
      subtitle.textContent = caption;
      overlay.classList.toggle('compact', mode === 'clip');
      app.hidden = mode !== 'demo';
      clip.hidden = mode !== 'clip';
      if (clip.hidden) clip.pause();
    };
    window.showApp = (url) => {
      if (app.src !== url) app.src = url;
      app.hidden = false;
    };
    window.compactOverlay = () => overlay.classList.add('compact');
    window.playClip = async (url, milliseconds) => {
      clip.src = url;
      let timeout;
      try {
        await Promise.race([
          clip.play(),
          new Promise((_, reject) => {
            timeout = setTimeout(() => reject(new Error('動画の読み込みに時間がかかっています。')), milliseconds);
          }),
        ]);
      } finally {
        clearTimeout(timeout);
      }
    };
  </script>
</body>
</html>
